version: '3.4'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "Pass123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  app:
    build: ./SensorApp
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__SensorDb: "Server=db,1433;Database=sdb;User Id=sa;Password=Pass123!;TrustServerCertificate=True;"
    depends_on:
      - db

volumes:
  sqldata:
